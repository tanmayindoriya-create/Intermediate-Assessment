app:
  name: data-platform

paths:
  raw: data/raw
  bronze: data/bronze
  silver: data/silver
  gold: data/gold

spark:
  app_name: data-platform
  master: local[*]
  configs:
    spark.sql.shuffle.partitions: 4
    spark.sql.execution.arrow.pyspark.enabled: true

mysql:
  url: jdbc:mysql://localhost:3306/data_platform
  driver: com.mysql.cj.jdbc.Driver
  database: data_platform
